<!-- [[fig:harvest-calculator]] — the Harvest price-impact calculator, running
     itself on a 10s loop. Self-contained: scoped CSS, own rAF driver, no CDN.
     Pauses off-screen and paints a single end state under reduced motion. -->
<figure class="breakout ps-fig ps-fig--calc" data-ps-anim="calc">
  <style>
  .ps-fig--calc{
    /* Local tokens only. The site owns --ink/--paper/--line/--mono/--magenta;
       these are the shades the demo introduced that the design system has no
       name for, kept prefixed so they cannot collide with a future token. */
    --ps-ink2:#0A0A0A; --ps-track:#E7E5E4; --ps-orange:#EA580C;
  }
  .ps-fig--calc .ps-calc{background:#fff;padding:32px;border:1px solid var(--line)}
  .ps-fig--calc .ps-calc__card{max-width:520px;margin:0 auto;border:1px solid var(--ps-ink2);background:#fff;padding:24px}
  .ps-fig--calc .ps-calc__head{border-bottom:1px solid var(--ps-ink2);padding-bottom:12px;margin-bottom:18px}
  .ps-fig--calc .ps-calc__title{font-family:var(--text);font-weight:800;color:var(--ps-ink2);font-size:18px;line-height:1.25}
  .ps-fig--calc .ps-calc__sub{font-family:var(--text);font-size:12px;line-height:1.4;color:#404040;margin-top:3px}
  .ps-fig--calc .ps-calc__rows{display:flex;flex-direction:column;gap:18px}
  .ps-fig--calc .ps-calc__lab{display:flex;justify-content:space-between;font-family:var(--text);font-size:13px;font-weight:700;color:var(--ps-ink2)}
  .ps-fig--calc .ps-calc__val{color:var(--ps-orange);font-weight:800;font-variant-numeric:tabular-nums}
  .ps-fig--calc .ps-slider{position:relative;height:14px;margin-top:8px}
  .ps-fig--calc .ps-slider__track{position:absolute;top:5px;left:0;right:0;height:4px;background:var(--ps-track)}
  .ps-fig--calc .ps-slider__fill{position:absolute;top:5px;left:0;height:4px;background:var(--ps-orange);width:0}
  .ps-fig--calc .ps-slider__thumb{position:absolute;top:0;width:14px;height:14px;border-radius:50%;
    background:var(--ps-orange);transform:translateX(-50%);left:0}
  .ps-fig--calc .ps-calc__toggle{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--text);font-size:13px;font-weight:700;color:var(--ps-ink2)}
  .ps-fig--calc .ps-calc__box{border:1px solid var(--ps-ink2);margin-top:18px;padding:16px}
  .ps-fig--calc .ps-calc__line{display:flex;justify-content:space-between;font-family:var(--text);
    font-size:13px;color:#404040;font-variant-numeric:tabular-nums;margin-bottom:8px}
  .ps-fig--calc .ps-calc__total{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--ps-ink2);padding-top:12px;margin-top:4px}
  .ps-fig--calc .ps-calc__total span:first-child{font-family:var(--text);font-size:13px;font-weight:700;color:var(--ps-ink2)}
  .ps-fig--calc .ps-calc__pct{font-size:20px;font-weight:800;color:var(--ps-orange);font-variant-numeric:tabular-nums}
  @media (max-width:560px){ .ps-fig--calc .ps-calc{padding:20px} }
  </style>

  <div class="ps-calc">
    <div class="ps-calc__card">
      <div class="ps-calc__head">
        <div class="ps-calc__title">Harvest Price Impact Calculator</div>
        <div class="ps-calc__sub">Estimate your legacy flat rate vs. the new base-plus-usage model.</div>
      </div>
      <div class="ps-calc__rows">
        <div>
          <div class="ps-calc__lab"><span>Team Size (Seats):</span><span class="ps-calc__val" data-seats>5</span></div>
          <div class="ps-slider"><div class="ps-slider__track"></div>
            <div class="ps-slider__fill" data-seatfill></div><div class="ps-slider__thumb" data-seatthumb></div></div>
        </div>
        <div>
          <div class="ps-calc__lab"><span>Active Projects:</span><span class="ps-calc__val" data-proj>12</span></div>
          <div class="ps-slider"><div class="ps-slider__track"></div>
            <div class="ps-slider__fill" data-projfill></div><div class="ps-slider__thumb" data-projthumb></div></div>
        </div>
        <div class="ps-calc__toggle"><span>Include Forecast scheduling</span><span class="ps-calc__val">On</span></div>
      </div>
      <div class="ps-calc__box">
        <div class="ps-calc__line"><span>Legacy monthly bill</span><span data-legacy>$60</span></div>
        <div class="ps-calc__line"><span>New base + usage</span><span data-new>$150</span></div>
        <div class="ps-calc__total"><span>Effective Cost Increase:</span><span class="ps-calc__pct" data-pct>+150%</span></div>
      </div>
    </div>
  </div>

  <figcaption><b>{{FIG}}</b><span>harvestsomesavings.com — a friend's real numbers: 29 seats, 173 projects.</span></figcaption>

  <script>
  (function () {
    var fig = document.currentScript.closest('figure');
    if (!fig || fig.dataset.psBound) return; fig.dataset.psBound = 1;
    var E = function (x) { return x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
    var an = function (t,a,b,f,to) { return f + (to-f)*E((t-a)/(b-a)); };
    var fmt = function (n) { return '$' + Math.round(n).toLocaleString('en-US'); };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var q = function (s) { return fig.querySelector(s); };

    function paint(T) {
      var t = reduce ? 7 : T % 10;
      var seats = Math.round(t < 8.5 ? an(t,1,3,5,29)    : an(t,8.5,9.5,29,5));
      var proj  = Math.round(t < 8.5 ? an(t,3.5,6,12,173): an(t,8.5,9.5,173,12));
      var legacy = seats * 12;
      var nw = seats * 18 + Math.max(0, proj - 3) * 10;
      var pct = Math.round((nw - legacy) / legacy * 100);
      var sp = (seats - 1) / 99 * 100, pp = (proj - 4) / 246 * 100;
      q('[data-seats]').textContent = seats;
      q('[data-proj]').textContent = proj;
      q('[data-seatfill]').style.width = sp + '%';
      q('[data-seatthumb]').style.left = sp + '%';
      q('[data-projfill]').style.width = pp + '%';
      q('[data-projthumb]').style.left = pp + '%';
      q('[data-legacy]').textContent = fmt(legacy);
      q('[data-new]').textContent = fmt(nw);
      q('[data-pct]').textContent = (pct >= 0 ? '+' : '') + pct + '%';
    }

    if (reduce) { paint(0); return; }
    // Off-screen figures stop painting. Three of these run on the Harvest post
    // and none of them should burn a frame while the reader is elsewhere.
    var on = true;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { on = es[0].isIntersecting; },
        { rootMargin: '120px 0px' }).observe(fig);
    }
    var t0 = performance.now();
    (function loop(now) { if (on) paint((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
  })();
  </script>
</figure>
