<!-- [[fig:what-the-work-is]] — ranked prevalence of each responsibility across
     531 listings. Prompt writing sits 8th at 20%; that row is the argument, so
     it carries the magenta. Single series, so no legend — the caption names it. -->
<figure class="breakout ps-fig ps-fig--rank" data-ps-anim="rank">
  <style>
  .ps-fig--rank{ --ps-bar:#121315; --ps-bar-soft:#C9C6BE; --ps-row:34px; }
  .ps-fig--rank .ps-rank{background:#fff;border:1px solid var(--line);padding:34px 30px 26px}
  .ps-fig--rank .ps-rank__hd{font-family:var(--mono);font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;font-size:9px;color:var(--grey);display:flex;justify-content:space-between;
    padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .ps-fig--rank .ps-rank__r{display:grid;grid-template-columns:1fr 46%;gap:18px;align-items:center;
    height:var(--ps-row);border-bottom:1px solid rgba(18,19,21,.07)}
  .ps-fig--rank .ps-rank__r:last-child{border-bottom:0}
  .ps-fig--rank .ps-rank__k{font-family:var(--text);font-size:13.5px;line-height:1.25;color:var(--grey)}
  .ps-fig--rank .ps-rank__r[data-hot] .ps-rank__k{color:var(--ink);font-weight:700}
  .ps-fig--rank .ps-rank__t{position:relative;display:flex;align-items:center;gap:10px}
  .ps-fig--rank .ps-rank__bwrap{flex:1;height:12px;position:relative}
  .ps-fig--rank .ps-rank__b{position:absolute;left:0;top:0;bottom:0;width:0;
    background:var(--ps-bar-soft);border-radius:0 4px 4px 0}
  .ps-fig--rank .ps-rank__r[data-hot] .ps-rank__b{background:var(--magenta)}
  .ps-fig--rank .ps-rank__v{font-family:var(--mono);font-weight:700;font-size:11.5px;
    color:var(--grey);width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .ps-fig--rank .ps-rank__r[data-hot] .ps-rank__v{color:var(--magenta-ink,#CD2575)}
  .ps-fig--rank .ps-rank__r:hover .ps-rank__b{opacity:.72}
  .ps-fig--rank .ps-rank__note{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--grey);padding-top:14px}
  @media (max-width:640px){
    .ps-fig--rank{ --ps-row:auto; }
    .ps-fig--rank .ps-rank{padding:24px 18px 18px}
    .ps-fig--rank .ps-rank__r{grid-template-columns:1fr;gap:5px;padding:9px 0;height:auto}
    .ps-fig--rank .ps-rank__k{font-size:13px}
  }
  </style>

  <div class="ps-rank">
    <div class="ps-rank__hd"><span>Named in the job description</span><span>Share of 531 listings</span></div>
    <div data-rankhost></div>
    <div class="ps-rank__note">Keyword prevalence across full description text</div>
  </div>

  <figcaption><b>{{FIG}}</b><span>{{ARG}}</span></figcaption>

  <script>
  (function () {
    var fig = document.currentScript.closest('figure');
    if (!fig || fig.dataset.psBound) return; fig.dataset.psBound = 1;

    var ROWS = [
      ['Script, story or narrative language', 42, 0],
      ['Technical pipeline, API or automation', 35, 0],
      ['Portfolio or reel required', 35, 0],
      ['Client and stakeholder communication', 29, 0],
      ['Traditional editing: Premiere, After Effects, Resolve', 27, 0],
      ['Social and platform-native formats', 26, 0],
      ['Character and visual consistency', 23, 0],
      ['Prompt writing and iteration', 20, 1],
      ['Music and sound design', 15, 0],
      ['Storyboard, shot list or previs', 15, 0]
    ];
    var MAX = 45;
    var host = fig.querySelector('[data-rankhost]');
    var bars = [];

    ROWS.forEach(function (d) {
      var r = document.createElement('div');
      r.className = 'ps-rank__r';
      if (d[2]) r.setAttribute('data-hot', '');
      r.innerHTML = '<div class="ps-rank__k">' + d[0] + '</div>' +
        '<div class="ps-rank__t"><div class="ps-rank__bwrap"><i class="ps-rank__b"></i></div>' +
        '<span class="ps-rank__v">' + d[1] + '%</span></div>';
      r.title = d[0] + ' — named in ' + d[1] + '% of 531 listings';
      host.appendChild(r);
      bars.push([r.querySelector('.ps-rank__b'), d[1] / MAX * 100]);
    });

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function paint(p) {
      bars.forEach(function (b, i) {
        // Rows wipe in sequence, top to bottom, over the first ~70% of the run.
        var lag = i / bars.length * 0.55;
        var t = (p - lag) / 0.45;
        t = t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
        b[0].style.width = (b[1] * t) + '%';
      });
    }
    // The finished chart is the default state, not the animation's end point:
    // if the observer never fires (deep link, no IO, a stalled rAF) the reader
    // still gets a correct chart rather than an empty frame.
    paint(1);
    if (reduce) return;

    function run() {
      var t0 = performance.now();
      (function loop(now) {
        var p = (now - t0) / 1400;
        paint(p < 1 ? p : 1);
        if (p < 1) requestAnimationFrame(loop);
      })(t0);
    }
    if ('IntersectionObserver' in window) {
      var armed = false, done = false;
      var io = new IntersectionObserver(function (es) {
        if (!es[0].isIntersecting) { if (!armed) { armed = true; paint(0); } return; }
        io.disconnect(); done = true;
        if (armed) run();   // scrolled into view — play it
      }, { rootMargin: '0px 0px -15% 0px' });
      io.observe(fig);
      // Rewinding to an empty frame is only safe if something guarantees the
      // refill. If the observer has not reported the figure visible by now,
      // stop waiting and show the finished chart.
      setTimeout(function () { if (!done) { io.disconnect(); paint(1); } }, 5000);
    }
  })();
  </script>
</figure>
